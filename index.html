<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>In Maintenance</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: #0b1020;
        color: #f7f7f8;
      }

      main {
        text-align: center;
        padding: 2rem;
        max-width: 40rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.8rem, 4vw, 2.6rem);
      }

      p {
        margin: 0;
        opacity: 0.9;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>In Maintenance</h1>
      <p>We're currently performing maintenance. Please check back soon.</p>
    </main>
  </body>
</html>
